[workspace]
name = "siming"
version = "0.1.0"
description = "司命（siming）：本机个人助理与跨 Agent 状态续接后台"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = ">=24.0"
hatchling = ">=1.24"
pytest = ">=8.0"
pyyaml = ">=6.0"
httpx = ">=0.27"
cryptography = ">=42.0"
beautifulsoup4 = ">=4.12"
pypdf = ">=4.0"
openpyxl = ">=3.1"

[pypi-dependencies]
lunar-python = ">=1.3.0"
siming = { path = ".", editable = true }
pyzipper = ">=0.4.0, <0.5"

[tasks]
siming = "siming"
test = "pytest"
doctor = "siming doctor"
