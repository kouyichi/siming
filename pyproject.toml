[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siming"
version = "0.1.0"
description = "司命（siming）：本机个人助理与跨 Agent 状态续接后台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27",
  "cryptography>=42.0",
  "beautifulsoup4>=4.12",
  "pypdf>=4.0",
  "openpyxl>=3.1",
  "lunar-python>=1.3.0",
]

[project.scripts]
siming = "siming.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/siming"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
